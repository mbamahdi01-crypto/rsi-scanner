name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pip-audit
      - name: Block committed secrets
        run: python tools/check_secrets.py
      - name: Compile Python
        run: python -m compileall -q app.py scanner.py markets.py build_data.py tests tools
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Dependency audit
        run: pip-audit -r requirements.txt
