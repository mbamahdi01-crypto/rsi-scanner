<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدخول — فلتر الانفراج RSI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f1115; color: #e2e8f0;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    background: #161920; border: 1px solid #24272f; border-radius: 14px;
    padding: 36px 32px; width: 100%; max-width: 380px;
    box-shadow: 0 10px 40px rgba(0,0,0,.4);
  }
  h1 { font-size: 20px; color: #4fd1c5; margin-bottom: 6px; text-align: center; }
  p.sub { color: #8a8f98; font-size: 13px; margin-bottom: 24px; text-align: center; }
  label { display: block; font-size: 13px; color: #8a8f98; margin-bottom: 6px; }
  input[type=password] {
    width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid #24272f;
    background: #1a1d24; color: #fff; font-size: 15px; margin-bottom: 18px; outline: none;
  }
  input[type=password]:focus { border-color: #4fd1c5; }
  button {
    width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer;
    background: #4fd1c5; color: #0f1115; font-weight: bold; font-size: 15px;
  }
  button:hover { opacity: .9; }
  .err { color: #f66565; font-size: 13px; margin-top: 12px; min-height: 18px; text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <h1>فلتر الانفراج RSI</h1>
    <p class="sub">أدخل كلمة المرور للدخول</p>
    <form id="login-form">
      <label for="password">كلمة المرور</label>
      <input type="password" id="password" autofocus autocomplete="current-password">
      <button type="submit">دخول</button>
      <div class="err" id="err"></div>
    </form>
  </div>
<script>
  const $ = id => document.getElementById(id);
  $('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('err').innerText = '';
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: $('password').value }),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok) { location.href = '/'; }
    else { $('err').innerText = data.error || 'حدث خطأ'; $('password').value = ''; $('password').focus(); }
  });
</script>
</body>
</html>
